name: CUSTOM / Dependency Security

# Lightweight, self-hosted fork policy. The original security.yml remains
# untouched and disabled; it contains hosted-main reporting/issue automation.
on:
  pull_request:
    branches: [custom]
  push:
    branches: [custom]

permissions:
  contents: read

concurrency:
  group: custom-dependency-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: CUSTOM / Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: '10.34.5'
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned osv-scanner
        run: bash scripts/security/install-osv-scanner.sh
      - name: Audit dependency lockfile with upstream severity and exception policy
        run: bash scripts/security/check-npm-audit.sh
