name: CUSTOM / Upstream Compatibility Review

# Advisory-only: never required for branch protection or release gating.
# It reports changes but does not acknowledge or update the reviewed baseline.
on:
  pull_request:
    branches: [custom]
  push:
    branches: [custom]

permissions:
  contents: read

concurrency:
  group: custom-upstream-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  upstream-review:
    name: CUSTOM / Upstream Compatibility Advisory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate custom code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Fetch synchronized fork main
        run: git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"

      - name: Compare upstream and custom workflows
        env:
          REPORT_DIR: ${{ runner.temp }}/breeze-upstream-review
        run: node scripts/custom-release/review-upstream-drift.mjs

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: custom-upstream-compatibility-${{ github.run_id }}
          path: ${{ runner.temp }}/breeze-upstream-review/
          if-no-files-found: warn
          retention-days: 30
